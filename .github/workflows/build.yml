name: Build extension

# Auf jedem Push/PR die Unit-Tests laufen lassen, die Extension linten + bauen. Der ZIP wird als Workflow-
# Artifact angehaengt (90 Tage Aufbewahrung), damit Reviewer/Tester direkt
# einen frischen Build laden koennen ohne lokal zu bauen.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Die Node-Tests (test/*.test.js, node:test, keine Abhaengigkeiten) laufen vor Lint/Build —
      # release.yml reicht nur ein, wenn sie gruen sind.
      - name: Unit-Tests
        run: npm test

      # web-ext genau in der Version aus package-lock.json, ohne Install-Skripte (wie release.yml).
      - name: web-ext aus dem Lockfile
        run: npm ci --ignore-scripts

      - name: web-ext lint
        run: |
          cd extension
          ../node_modules/.bin/web-ext lint --no-config-discovery --self-hosted

      - name: web-ext build
        run: |
          cd extension
          ../node_modules/.bin/web-ext build --config=web-ext-config.cjs --overwrite-dest

      - name: Upload extension ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-zip
          path: extension/web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 90
