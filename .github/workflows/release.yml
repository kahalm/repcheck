name: Release

# Bei einem Git-Tag wie `v1.3.1` ein GitHub Release anlegen und die
# Extension-ZIP anhaengen. Wenn die AMO-Repo-Secrets gesetzt sind
# (`AMO_API_KEY` + `AMO_API_SECRET`), wird die neue Version parallel beim
# OEFFENTLICHEN Mozilla-AMO-Listing eingereicht (--channel=listed → Review).
#
# Hinweise zum listed-Channel:
# - Das AMO-Listing muss bereits existieren (einmalig im Dev Hub angelegt,
#   inkl. Beschreibung/Screenshots/Kategorien); die API laedt nur neue
#   Versionen eines bestehenden Listings hoch.
# - listed erzeugt KEINE herunterladbare .xpi fuers GitHub-Release — die
#   Distribution laeuft ueber addons.mozilla.org nach Freigabe.
# - --approval-timeout=0: nach dem Upload sofort weiter, nicht auf das
#   (asynchrone) Review-Ergebnis warten.
#
# Setup-Hinweis: Tag bauen mit
#   git tag v1.3.1 && git push origin v1.3.1
# AMO-Keys generierst du unter:
#   https://addons.mozilla.org/developers/addon/api/key/
# und legst sie unter "Settings → Secrets → Actions" als
# AMO_API_KEY + AMO_API_SECRET an.
#
# Chrome Web Store (analog): wenn die Secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET,
# CWS_REFRESH_TOKEN und CWS_APP_ID gesetzt sind, wird dieselbe ZIP per
# Chrome-Web-Store-Publish-API hochgeladen und zur Veroeffentlichung
# eingereicht. Den refresh_token erzeugst du einmalig lokal mit
#   node extension/get-cws-refresh-token.mjs
# (siehe Skript-Kopf). CWS erlaubt nur EINE Version gleichzeitig im Review —
# haengt noch eine, scheitert der Job `cws`.
#
# Jobs: test → build → (github-release | amo | cws). Die drei letzten laufen
# unabhaengig voneinander: ein Store-Fehler laesst das GitHub-Release stehen,
# macht aber den Lauf ROT (GitHub schickt dann die uebliche Fehler-Mail). Bis
# v1.68.13 endeten Store-Fehler in `|| echo ::warning::` bzw. `exit 0`, der
# Lauf war gruen, und niemand reichte nach. Nachreichen (z. B. wenn das
# CWS-Review der Vorversion durch ist): im Actions-Lauf „Re-run failed jobs" —
# nimmt denselben geprueften Commit und dieselbe ZIP (Artefakt 90 Tage).
#
# Test-Gate: Der Job `test` laesst die Unit-Tests laufen und prueft, dass der Tag
# zur `version` in extension/manifest.json passt (v1.2.3 == 1.2.3). Erst danach
# baut `build` die ZIP, und erst dann wird eingereicht. Ein Handstart (workflow_dispatch)
# baut genau den angegebenen Tag (refs/tags/<tag>), nie den Stand des Branches,
# auf dem er gestartet wurde; ein nicht vorhandener Tag bricht beim Checkout ab.
# Nur `test` loest den Tag auf und gibt den geprueften Commit aus (outputs.sha);
# `build` und `amo` checken genau diesen Commit aus, nicht noch einmal den Tag. Wird der
# Tag waehrend des Laufs neu gesetzt (git tag -f / push -f), geht so trotzdem
# nur der gepruefte Commit an AMO/CWS.
#
# Lieferkette: web-ext kommt aus package-lock.json (devDependency mit exakter
# Version, `npm ci --ignore-scripts`), nie als `npx web-ext@latest` — sonst liefe
# beim naechsten Tag ungeprueft die jeweils neueste Version samt Abhaengigkeiten
# mit den AMO-Secrets und dem Schreib-Token. Actions sind auf Commit-SHAs
# gepinnt (Kommentar = Tag), checkout legt keinen Token in .git/config ab
# (persist-credentials: false), die AMO-Keys gehen per env (WEB_EXT_API_KEY/
# WEB_EXT_API_SECRET) statt als Argument an web-ext. Ein web-ext-Update ist ein
# bewusster Commit: `npm install --save-dev --save-exact web-ext@<version>`.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.1)'
        required: true

# Nur lesen; Schreibrecht bekommt allein der Job, der das GitHub-Release anlegt.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      # Mit explizitem ref pinnt actions/checkout nicht auf github.sha, sondern holt das
      # aktuelle Ziel des Tags. Diesen Commit prueft der Job; release baut genau ihn.
      - name: Geprüften Commit festhalten
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Unit-Tests
        run: npm test

      - name: Tag passt zur Manifest-Version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG passt nicht zu extension/manifest.json version $VERSION"
            exit 1
          fi
          echo "Tag $TAG == manifest.json $VERSION"

  # Baut die ZIP aus dem geprueften Commit und reicht sie als Artefakt an die
  # Folge-Jobs weiter. Keine Secrets, kein Schreibrecht.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.test.outputs.sha }}
          persist-credentials: false

      # Ein leerer Output liesse checkout still auf github.sha bzw. den Branch zurueckfallen.
      - name: Gebaut wird der geprüfte Commit
        env:
          SHA: ${{ needs.test.outputs.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -z "$SHA" ] || [ "$HEAD_SHA" != "$SHA" ]; then
            echo "::error::Checkout $HEAD_SHA ist nicht der gepruefte Commit '$SHA'"
            exit 1
          fi
          echo "Baue den geprueften Commit $SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # web-ext genau in der Version aus package-lock.json (Integritaets-Hashes), ohne
      # Install-Skripte der Abhaengigkeiten.
      - name: web-ext aus dem Lockfile
        run: npm ci --ignore-scripts

      - name: Build (unsigned)
        run: |
          cd extension
          ../node_modules/.bin/web-ext build --config=web-ext-config.cjs --overwrite-dest

      # 90 Tage: so lange laesst sich ein gescheiterter Store-Job mit derselben ZIP nachholen.
      - name: ZIP an die Folge-Jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-zip
          path: extension/web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 90

  # Legt das GitHub-Release an. Haengt NICHT an den Store-Jobs: scheitert AMO oder
  # CWS, bleibt das Release stehen, der Lauf wird trotzdem rot.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ZIP aus dem Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-zip
          path: extension/web-ext-artifacts

      - name: Create GitHub Release
        # Release fuer den gebauten Tag: beim Tag-Push github.ref_name, beim Handstart die
        # Eingabe `tag` (vom Checkout in `test` als refs/tags/<tag> aufgeloest und gegen die
        # Manifest-Version geprueft). Ohne tag_name naehme softprops github.ref_name, beim
        # Handstart also den Branch oder Tag, von dem aus gestartet wurde.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            extension/web-ext-artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false

  # AMO signiert aus dem Quellverzeichnis (web-ext sign baut selbst), deshalb
  # derselbe geprüfte Commit wie in build. Scheitert die Einreichung, ist der Job rot.
  amo:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.test.outputs.sha }}
          persist-credentials: false

      - name: Eingereicht wird der geprüfte Commit
        env:
          SHA: ${{ needs.test.outputs.sha }}
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -z "$SHA" ] || [ "$HEAD_SHA" != "$SHA" ]; then
            echo "::error::Checkout $HEAD_SHA ist nicht der gepruefte Commit '$SHA'"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: web-ext aus dem Lockfile
        run: npm ci --ignore-scripts

      - name: Submit to Firefox AMO listing (if secrets configured)
        # web-ext liest --api-key/--api-secret aus WEB_EXT_API_KEY/WEB_EXT_API_SECRET.
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "AMO secrets not set — skipping AMO submission"
            exit 0
          fi
          cd extension
          if ! ../node_modules/.bin/web-ext sign \
            --config=web-ext-config.cjs \
            --channel=listed \
            --approval-timeout=0; then
            echo "::error::AMO-Einreichung fehlgeschlagen — GitHub-Release steht, AMO nachreichen („Re-run failed jobs“ oder Dev Hub)"
            exit 1
          fi

  # Laedt genau die ZIP aus build hoch. Scheitert OAuth, Upload oder Publish, ist der Job rot.
  cws:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ZIP aus dem Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-zip
          path: extension/web-ext-artifacts

      - name: Submit to Chrome Web Store (if secrets configured)
        # Direkt gegen die Chrome Web Store API v1.1 statt der
        # chrome-webstore-upload-cli — deren Flags/Env-Vars/Pflichtfelder haben
        # sich zwischen Major-Versionen mehrfach geaendert (v4 verlangte zuletzt
        # ein "publisherId"). curl+jq sind auf ubuntu-latest vorhanden.
        # Ablauf: OAuth-Refresh → Upload (PUT) → Publish (POST). Jeder Fehler macht
        # den Job rot (z. B. wenn schon eine Version im Review haengt) — das
        # GitHub-Release haengt nicht daran.
        env:
          EXTENSION_ID: ${{ secrets.CWS_APP_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          # Whitespace (auch \r/Newline aus Copy-Paste bzw. Web-UI) aus den Secrets strippen —
          # ein Trailing-Newline in client_id führt sonst zu "invalid_client: OAuth client not found",
          # obwohl der Wert lokal (ohne Umbruch) funktioniert. Keiner der Werte enthält interne Spaces.
          CLIENT_ID="$(printf %s "$CLIENT_ID" | tr -d '[:space:]')"
          CLIENT_SECRET="$(printf %s "$CLIENT_SECRET" | tr -d '[:space:]')"
          REFRESH_TOKEN="$(printf %s "$REFRESH_TOKEN" | tr -d '[:space:]')"
          EXTENSION_ID="$(printf %s "$EXTENSION_ID" | tr -d '[:space:]')"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || \
             [ -z "$REFRESH_TOKEN" ] || [ -z "$EXTENSION_ID" ]; then
            echo "CWS secrets not set — skipping Chrome Web Store submission"
            exit 0
          fi
          ZIP="$(ls -1 extension/web-ext-artifacts/*.zip | head -n1)"
          echo "Uploading $ZIP to Chrome Web Store"
          TOKEN_RESP=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            # Nur die Fehlerfelder loggen (kein Token/Secret in der Antwort) — verrät die Ursache
            # (invalid_client = ID/Secret falsch, invalid_grant = Refresh-Token passt nicht/widerrufen).
            echo "::error::CWS: OAuth-Refresh fehlgeschlagen ($(echo "$TOKEN_RESP" | jq -rc '{error, error_description}'))"
            exit 1
          fi
          UPLOAD=$(curl -sS -X PUT -T "$ZIP" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID?uploadType=media")
          echo "Upload-Antwort: $UPLOAD"
          if [ "$(echo "$UPLOAD" | jq -r '.uploadState // empty')" != "SUCCESS" ]; then
            echo "::error::CWS-Upload nicht SUCCESS (haengt noch eine Version im Review? Danach „Re-run failed jobs“)"
            exit 1
          fi
          PUBLISH=$(curl -sS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          echo "Publish-Antwort: $PUBLISH"
          if echo "$PUBLISH" | jq -e '.status | index("OK")' >/dev/null 2>&1; then
            echo "Chrome Web Store: Version eingereicht/veroeffentlicht."
          else
            echo "::error::CWS-Publish nicht OK (evtl. noch im Review): $PUBLISH"
            exit 1
          fi
